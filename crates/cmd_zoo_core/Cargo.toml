[package]
name = "cmd_zoo_core"
version = "0.1.0"
edition = "2024"
description = "Headless simulation core for cmd_zoo (no graphics engine). Runs both in the client (Solo/offline) and, later, inside the SpacetimeDB module (online authority)."

[dependencies]
# glam pinned to the version macroquad re-exports so Vec2 is the identical type
# across the client boundary.
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
anyhow = "1"
once_cell = "1"
base64 = "0.22"
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
fs2 = "0.4"
directories = "5"

[dev-dependencies]
tempfile = "3"
