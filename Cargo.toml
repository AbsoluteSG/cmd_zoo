[package]
name = "cmd_zoo"
version = "0.1.0"
edition = "2024"
description = "An idle-zoo game in Rust"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
anyhow = "1"
once_cell = "1"
base64 = "0.22"
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

# Only used on Windows targets — gated inside build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Production profile: smaller exe at the cost of slower link times.
# `lto = true` enables whole-program optimization across crates.
# `codegen-units = 1` lets LLVM optimize more aggressively (no per-unit splits).
# `strip = "symbols"` drops debug names from the final binary.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
