[package]
name = "cmd_zoo"
version = "0.1.0"
edition = "2024"
description = "An idle-zoo game in Rust"

[workspace]
members = ["crates/cmd_zoo_core"]
resolver = "2"

[features]
# Build with the Steam relay transport. Requires the Steamworks SDK to be
# discoverable by the `steamworks-sys` crate at build time (steam_api.lib on
# the linker path). Off by default so plain `cargo build` works without SDK.
default = []
steam = ["dep:steamworks"]

[dependencies]
cmd_zoo_core = { path = "crates/cmd_zoo_core" }
macroquad = { version = "0.4", features = ["audio"] }
# Pinned to the exact version macroquad re-exports so `glam::Vec2` and
# `macroquad::math::Vec2` are the identical type (lets the headless domain use
# glam directly while the client keeps using macroquad's re-export).
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
directories = "5"
anyhow = "1"
once_cell = "1"
base64 = "0.22"
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
fs2 = "0.4"
steamworks = { version = "0.11", optional = true }
# SpacetimeDB client SDK (online backend). Matches the module + CLI (2.4.x).
spacetimedb-sdk = "2.4"

[dev-dependencies]
tempfile = "3"

# Only used on Windows targets — gated inside build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Production profile: smaller exe at the cost of slower link times.
# `lto = true` enables whole-program optimization across crates.
# `codegen-units = 1` lets LLVM optimize more aggressively (no per-unit splits).
# `strip = "symbols"` drops debug names from the final binary.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
